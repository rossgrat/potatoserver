---
apiVersion: v1
kind: Namespace
metadata:
  name: pages-cms
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pages-cms
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pages-cms
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        envFrom:
        - secretRef:
            name: database
        env:
        - name: PGDATA
          value: "/var/lib/postgresql/18/docker"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT 1"
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - sh
            - "-c"
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: "/var/lib/postgresql"
        - name: socket
          mountPath: "/var/run/postgresql"
        - name: temporary
          mountPath: "/tmp"
      volumes:
      - name: socket
        emptyDir: {}
      - name: temporary
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-retain
      resources:
        requests:
          storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pages-cms
  namespace: pages-cms
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pages-cms
  template:
    metadata:
      labels:
        app: pages-cms
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-database
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        command:
        - sh
        - "-c"
        - until psql -X -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT
          1" >/dev/null 2>&1; do sleep 1; done
        envFrom:
        - secretRef:
            name: database
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: database
              key: POSTGRES_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsUser: 70
          runAsGroup: 70
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: pages-cms
        image: docker.io/library/potatoserver-pages-cms:2.1.8-r4-node24.22.2
        envFrom:
        - secretRef:
            name: application
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: "/sign-in"
            port: 3000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: "/sign-in"
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: temporary
          mountPath: "/tmp"
        imagePullPolicy: Never
      volumes:
      - name: temporary
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pages-cms
  namespace: pages-cms
spec:
  type: NodePort
  selector:
    app: pages-cms
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30083
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pages-cms
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database
  namespace: pages-cms
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: pages-cms
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application
  namespace: pages-cms
spec:
  podSelector:
    matchLabels:
      app: pages-cms
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 172.18.0.0/16
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
