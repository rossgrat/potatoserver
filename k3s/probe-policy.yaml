apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-clients
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: allowed
      ports:
        - protocol: TCP
          port: 8080
