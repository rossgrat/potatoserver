---
apiVersion: v1
kind: Namespace
metadata:
  name: job-board
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: job-board
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: job-board
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        envFrom:
        - secretRef:
            name: database
        env:
        - name: PGDATA
          value: "/var/lib/postgresql/18/docker"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT 1"
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - sh
            - "-c"
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: "/var/lib/postgresql"
        - name: socket
          mountPath: "/var/run/postgresql"
        - name: temporary
          mountPath: "/tmp"
      volumes:
      - name: socket
        emptyDir: {}
      - name: temporary
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-retain
      resources:
        requests:
          storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-board
  namespace: job-board
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: job-board
      role: api
  template:
    metadata:
      labels:
        app: job-board
        role: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      initContainers:
      - name: wait-for-database
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        command:
        - sh
        - "-c"
        - until psql -X -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT
          1" >/dev/null 2>&1; do sleep 1; done
        envFrom:
        - secretRef:
            name: database
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: database
              key: POSTGRES_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsUser: 70
          runAsGroup: 70
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: job-board
        image: ghcr.io/rossgrat/job-board-v2@sha256:188b1be93e4549354bc79afefecdde6d717e22048f9311e26d8a6f9ffda3326a
        envFrom:
        - secretRef:
            name: application
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: "/login"
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: "/login"
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: temporary
          mountPath: "/tmp"
        args:
        - api
        env:
        - name: POSTGRES_HOST
          value: postgres
        - name: SERVER_PORT
          value: '8080'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: lgtm.lgtm.svc.cluster.local:4317
        - name: OTEL_SERVICE_NAME
          value: job-board-api
      volumes:
      - name: temporary
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: job-board
  namespace: job-board
spec:
  type: ClusterIP
  selector:
    app: job-board
    role: api
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: job-board
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database
  namespace: job-board
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: job-board
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application
  namespace: job-board
spec:
  podSelector:
    matchLabels:
      app: job-board
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: caddy
      podSelector:
        matchLabels:
          role: proxy
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: job-board
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: job-board
      role: worker
  template:
    metadata:
      labels:
        app: job-board
        role: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      initContainers:
      - name: wait-for-database
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        command:
        - sh
        - "-c"
        - until psql -X -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT
          1" >/dev/null 2>&1; do sleep 1; done
        envFrom:
        - secretRef:
            name: database
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: database
              key: POSTGRES_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsUser: 70
          runAsGroup: 70
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: worker
        image: ghcr.io/rossgrat/job-board-v2@sha256:188b1be93e4549354bc79afefecdde6d717e22048f9311e26d8a6f9ffda3326a
        envFrom:
        - secretRef:
            name: application
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: temporary
          mountPath: "/tmp"
        args:
        - worker
        env:
        - name: POSTGRES_HOST
          value: postgres
        - name: SERVER_PORT
          value: '8080'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: lgtm.lgtm.svc.cluster.local:4317
        - name: OTEL_SERVICE_NAME
          value: job-board-worker
      volumes:
      - name: temporary
        emptyDir: {}
