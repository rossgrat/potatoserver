---
apiVersion: v1
kind: Namespace
metadata:
  name: wubzduh
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: wubzduh
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: wubzduh
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:15.19-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        envFrom:
        - secretRef:
            name: database
        env:
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - sh
            - "-c"
            - psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT 1"
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - sh
            - "-c"
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: "/var/lib/postgresql/data"
        - name: socket
          mountPath: "/var/run/postgresql"
        - name: temporary
          mountPath: "/tmp"
      volumes:
      - name: socket
        emptyDir: {}
      - name: temporary
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-retain
      resources:
        requests:
          storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wubzduh
  namespace: wubzduh
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wubzduh
  template:
    metadata:
      labels:
        app: wubzduh
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      initContainers:
      - name: wait-for-database
        image: postgres:15.19-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
        command:
        - sh
        - "-c"
        - until psql -X -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT
          1" >/dev/null 2>&1; do sleep 1; done
        envFrom:
        - secretRef:
            name: database
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: database
              key: POSTGRES_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsUser: 70
          runAsGroup: 70
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: wubzduh
        image: ghcr.io/rossgrat/wubzduh@sha256:209adf6eacfcdfb23a558a618fee2eed41cc41a64fb01a6cf4796e08f8460373
        envFrom:
        - secretRef:
            name: application
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: "/feed/"
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: "/static/style.css"
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: temporary
          mountPath: "/tmp"
        - name: configuration
          mountPath: "/app/config.yaml"
          subPath: config.yaml
          readOnly: true
        - name: logs
          mountPath: "/var/log/wubzduh"
        command:
        - "/app/wubzduh"
        args:
        - serve
        - "--config"
        - "/app/config.yaml"
      volumes:
      - name: temporary
        emptyDir: {}
      - name: configuration
        configMap:
          name: configuration
      - name: logs
        persistentVolumeClaim:
          claimName: logs
---
apiVersion: v1
kind: Service
metadata:
  name: wubzduh
  namespace: wubzduh
spec:
  type: NodePort
  selector:
    app: wubzduh
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30084
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: wubzduh
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database
  namespace: wubzduh
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: wubzduh
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application
  namespace: wubzduh
spec:
  podSelector:
    matchLabels:
      app: wubzduh
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 172.18.0.0/16
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configuration
  namespace: wubzduh
data:
  config.yaml: |
    server:
      port: "8080"
    db:
      host: postgres
      port: 5432
      name: wubz
    log:
      path: /var/log/wubzduh/app.log
      max_size_mb: 10
      max_backups: 3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logs
  namespace: wubzduh
spec:
  storageClassName: local-retain
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
