apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: providers-and-telemetry
  namespace: job-board
spec:
  podSelector:
    matchLabels:
      app: job-board
  policyTypes: [Egress]
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        - protocol: TCP
          port: 4317
