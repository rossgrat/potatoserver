---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: providers-and-telemetry
  namespace: job-board
spec:
  podSelector:
    matchLabels:
      app: job-board
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: lgtm
      podSelector:
        matchLabels:
          app: lgtm
    ports:
    - protocol: TCP
      port: 4317
