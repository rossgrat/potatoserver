apiVersion: batch/v1
kind: Job
metadata:
  generateName: pages-cms-image-check-
  namespace: pages-cms
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: docker.io/library/potatoserver-pages-cms:2.1.8-r4-node24.22.2
          imagePullPolicy: Never
          command: [node, --version]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
