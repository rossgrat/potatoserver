---
apiVersion: v1
kind: Namespace
metadata:
  name: ntfy
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
      - name: ntfy
        image: binwiederhier/ntfy:v2.34.0@sha256:901e14503d3f605f445be0e68f2ac71f0aa73391897ce6ceb599f8c48d8b3792
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: "/v1/health"
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: "/v1/health"
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: temporary
          mountPath: "/tmp"
        - name: configuration
          mountPath: "/etc/ntfy/server.yml"
          subPath: server.yml
          readOnly: true
        - name: auth
          mountPath: "/var/lib/ntfy"
        - name: cache
          mountPath: "/var/cache/ntfy"
        args:
        - serve
        env:
        - name: NTFY_AUTH_FILE
          value: "/var/lib/ntfy/auth.db"
        - name: NTFY_AUTH_DEFAULT_ACCESS
          value: deny-all
        - name: NTFY_BASE_URL
          value: https://alerts.grattafiori.dev
        - name: NTFY_LISTEN_HTTP
          value: ":8080"
      volumes:
      - name: temporary
        emptyDir: {}
      - name: configuration
        configMap:
          name: configuration
      - name: auth
        persistentVolumeClaim:
          claimName: auth
      - name: cache
        persistentVolumeClaim:
          claimName: cache
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: ntfy
spec:
  type: NodePort
  selector:
    app: ntfy
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30086
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ntfy
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application
  namespace: ntfy
spec:
  podSelector:
    matchLabels:
      app: ntfy
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 172.18.0.0/16
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: configuration
  namespace: ntfy
data:
  server.yml: |
    base-url: https://alerts.grattafiori.dev
    upstream-base-url: https://ntfy.sh
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth
  namespace: ntfy
spec:
  storageClassName: local-retain
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache
  namespace: ntfy
spec:
  storageClassName: local-retain
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
