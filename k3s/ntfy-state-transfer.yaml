---
apiVersion: v1
kind: Pod
metadata:
  name: state-transfer
  namespace: ntfy
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: transfer
    image: postgres:15.19-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
    command:
    - sh
    - "-c"
    - sleep 600
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
    - name: auth
      mountPath: "/auth"
    - name: cache
      mountPath: "/cache"
  volumes:
  - name: auth
    persistentVolumeClaim:
      claimName: auth
  - name: cache
    persistentVolumeClaim:
      claimName: cache
  terminationGracePeriodSeconds: 1
