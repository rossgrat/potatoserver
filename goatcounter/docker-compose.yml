services:
  goatcounter:
    image: arp242/goatcounter:2.7.0@sha256:791df3317bf5ce379511181a4802aaf29127a318b372d4fe39ec59e1c5af44be
    restart: unless-stopped
    command: ["serve", "-listen", ":8080", "-tls", "http", "-automigrate"]
    volumes:
      - goatcounter-data:/home/goatcounter/goatcounter-data
    networks:
      - caddy-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  caddy-network:
    external: true

volumes:
  goatcounter-data:
