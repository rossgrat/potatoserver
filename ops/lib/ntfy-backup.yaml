---
apiVersion: v1
kind: Pod
metadata:
  name: state-backup
  namespace: ntfy
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: transfer
    image: node:24.22.2-bookworm-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9
    command:
    - sh
    - "-c"
    - sleep 600
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
    - name: auth
      mountPath: "/auth"
      readOnly: true
    - name: cache
      mountPath: "/cache"
      readOnly: true
    - name: temporary
      mountPath: "/tmp"
  volumes:
  - name: auth
    persistentVolumeClaim:
      claimName: auth
  - name: cache
    persistentVolumeClaim:
      claimName: cache
  - name: temporary
    emptyDir: {}
  terminationGracePeriodSeconds: 1
