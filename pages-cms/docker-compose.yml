services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: pagescms
      POSTGRES_DB: pagescms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - database
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagescms -d pagescms"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: potatoserver-pages-cms:2.1.8-r4-node24.22.2
    build: .
    command: ["npm", "run", "db:migrate"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database

  app:
    image: potatoserver-pages-cms:2.1.8-r4-node24.22.2
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3030:3000"
    networks:
      - default
      - database
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  database:
    internal: true

volumes:
  postgres_data:
