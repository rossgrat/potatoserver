services:
  lgtm:
    image: grafana/otel-lgtm:0.38.1@sha256:0df9bc14142000b161344bd24caf6ddd319b7319055aedaf9b0692b125730af7
    container_name: lgtm
    networks:
      - caddy-network
    ports:
      - "172.18.0.1:4317:4317"
    volumes:
      - lgtm-data:/data
      - ./provisioning/dashboards:/provisioning/dashboards
      - ./provisioning/dashboards/job-board.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/job-board.yaml
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

networks:
  caddy-network:
    external: true

volumes:
  lgtm-data:
